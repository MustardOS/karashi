name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j2 check

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-build core
        run: make -j2 BUILD_DIR=build-aarch64 CC=aarch64-linux-gnu-gcc
      - name: Verify architecture and exports
        run: |
          test "$(aarch64-linux-gnu-readelf -h build-aarch64/karashi_libretro.so | sed -n 's/^  Machine: *//p')" = "AArch64"
          test "$(aarch64-linux-gnu-nm -D --defined-only build-aarch64/karashi_libretro.so | awk '$2 == "T" && $3 ~ /^retro_/ { count++ } END { print count + 0 }')" -eq 25
