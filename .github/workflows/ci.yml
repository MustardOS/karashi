name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j2 check
      - name: Package core
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          install -Dm644 build/karashi_libretro.so package/x86_64/karashi_libretro.so
          install -Dm644 karashi_libretro.info package/x86_64/karashi_libretro.info
          install -Dm644 LICENSE package/x86_64/LICENSE
          install -Dm644 README.md package/x86_64/README.md
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -C package/x86_64 -czf karashi-libretro-x86_64.tar.gz .
      - name: Upload release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: karashi-libretro-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-build core
        run: make -j2 BUILD_DIR=build-aarch64 CC=aarch64-linux-gnu-gcc
      - name: Verify architecture and exports
        run: |
          test "$(aarch64-linux-gnu-readelf -h build-aarch64/karashi_libretro.so | sed -n 's/^  Machine: *//p')" = "AArch64"
          test "$(aarch64-linux-gnu-nm -D --defined-only build-aarch64/karashi_libretro.so | awk '$2 == "T" && $3 ~ /^retro_/ { count++ } END { print count + 0 }')" -eq 25
      - name: Package core
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          install -Dm644 build-aarch64/karashi_libretro.so package/aarch64/karashi_libretro.so
          install -Dm644 karashi_libretro.info package/aarch64/karashi_libretro.info
          install -Dm644 LICENSE package/aarch64/LICENSE
          install -Dm644 README.md package/aarch64/README.md
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -C package/aarch64 -czf karashi-libretro-aarch64.tar.gz .
      - name: Upload release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: karashi-libretro-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - x86_64
      - aarch64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: karashi-release
      cancel-in-progress: false
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="ci-${GITHUB_RUN_NUMBER}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Karashi build ${GITHUB_RUN_NUMBER}" \
              --notes "Automated Karashi build from commit ${GITHUB_SHA}." \
              --prerelease
          fi
      - name: Retain current and two previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t stale_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("ci-")) | .tag_name' |
              tail -n +4
          )
          for stale_tag in "${stale_tags[@]}"; do
            gh release delete "$stale_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
